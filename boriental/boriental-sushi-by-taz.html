.nomap{padding:40px;color:var(--mut);text-align:center}

.seg-bar{display:grid;grid-template-columns:190px 1fr 50px;gap:10px;align-items:center;margin:8px 0;font-size:13px}

</head>

  var L=S.leads,wk=Date.now()-7*DAY;
  return {total:L.length,ready:L.filter(function(l){return l.score>=80&&l.status!=='Lost';}).length,
   reached:L.filter(function(l){return l.touches.some(function(t){return t.ts>=wk;});}).length,
   replies:L.filter(function(l){return l.repliedAt&&l.repliedAt>=wk;}).length,
   tastings:L.filter(function(l){return l.stageAt.Tasting&&l.stageAt.Tasting>=wk;}).length,
   booked7:L.filter(function(l){return l.stageAt.Booked&&l.stageAt.Booked>=wk;}).length,
   booked:L.filter(function(l){return l.status==='Booked';}).length};
}
var GAPS=[0,3,6];
function nextTouch(l){
  var n=l.touches.length;
  if(n>=3||l.status==='Lost'||l.status==='Booked'||l.replied||l.score<80)return null;
  var due=n===0?Date.now():l.touches[0].ts+GAPS[n]*DAY;

}

   '<div class="card mt"><h2>Timing</h2><p class="mut" style="margin:6px 0 0">Reach out 2 to 6 weeks before the event. Three touches over 6 days, sample tray as the close. Holiday and December dates first, then NYE, winter socials and Q1 kickoffs, then the year-round Latin and cultural calendar.</p></div>';
};
VIEWS.out=function(){
  var ch=outTab,T=S.templates[ch],ok=S.approved[ch];
  var cap=S.settings.weekly,sent=S.leads.filter(function(l){return l.touches.some(function(t){return t.ts>=Date.now()-7*DAY;});}).length;
  var q=S.leads.map(function(l){return {l:l,nt:nextTouch(l)};}).filter(function(x){return x.nt&&x.l.channel===ch;}).sort(function(a,b){return a.nt.due-b.nt.due;});
  var tpl=T.map(function(t,i){return '<div class="mt"><div class="row sp"><b>Touch '+(i+1)+'</b><span class="mut">Day '+t.day+'</span></div>'+
    (ch==='email'?'<div class="f mt"><label>Subject</label><input data-bind="tpl" data-ch="'+ch+'" data-i="'+i+'" data-f="subject" value="'+esc(t.subject)+'"></div>':'')+
    '<div class="f"><label>Message</label><textarea data-bind="tpl" data-ch="'+ch+'" data-i="'+i+'" data-f="body">'+esc(t.body)+'</textarea></div></div>';}).join('');
  var queue=q.length?q.slice(0,40).map(function(x){var l=x.l,t=T[x.nt.n-1],msg=(ch==='email'?'Subject: '+fill(t.subject,l)+'\n\n':'')+fill(t.body,l);
    return '<div class="qi"><div><b>'+esc(l.name)+'</b> <span class="mut">'+esc(l.hood)+'</span><br><small class="mut">Touch '+x.nt.n+' of 3 · '+(x.nt.now?'<span class="or">due now</span>':'due in '+Math.ceil((x.nt.due-Date.now())/DAY)+' d')+(ch==='email'?(l.email?' · '+esc(l.email):' · no email yet'):(l.handle?' · '+esc(l.handle):' · no handle yet'))+'</small>'+
     '<details><summary class="mut" style="cursor:pointer;font-size:13px">Preview</summary><div class="prev">'+esc(msg)+'</div></details></div>'+
     '<div class="row" style="align-items:flex-start"><button class="btn sm sec" data-act="copyMsg" data-id="'+l.id+'">Copy</button><button class="btn sm" data-act="sent" data-id="'+l.id+'">Mark sent</button></div></div>';}).join(''):'<p class="mut mt">Nothing queued. Leads need a score of 80 or more and an unsent touch.</p>';
  return '<div class="tabs"><button class="'+(ch==='email'?'on':'')+'" data-act="outTab" data-t="email">Email track</button><button class="'+(ch==='dm'?'on':'')+'" data-act="outTab" data-t="dm">Social DM track</button></div>'+
   '<div class="grid g2"><div class="card"><div class="row sp"><h2>'+(ch==='email'?'Email sequence':'DM sequence')+'</h2><label class="row" style="margin:0"><input type="checkbox" style="width:auto" data-bind="approve" data-ch="'+ch+'" '+(ok?'checked':'')+'> Approved by Izaya</label></div>'+
   '<p class="mut" style="margin:6px 0 0">'+(ch==='email'?'Sent from a separate sending domain, for offices, corporate and apartment communities.':'For events, venues and hospitality. Sent by hand as DMs.')+' Fields: {{first}} {{business}} {{hood}} {{chef}} {{sign}}</p>'+
   (ok?'':'<div class="banner mt" style="margin-bottom:0">Draft copy. Get Izaya\'s approval before anything goes out.</div>')+tpl+'</div>'+
   '<div class="card"><div class="row sp"><h2>Send queue</h2><span class="badge b-o">'+sent+' of '+cap+' reached this week</span></div><p class="mut" style="margin:6px 0 0">Copy the message, send it, then mark it sent. The next touch schedules itself. A reply stops the sequence.</p>'+queue+'</div></div>';
};
VIEWS.pipe=function(){
  var cols=STAGES.map(function(st){
    var items=S.leads.filter(function(l){return l.status===st;}).sort(function(a,b){return b.score-a.score;});
    var shown=st==='New'?items.filter(function(l){return l.score>=80;}).slice(0,12):items,hidden=items.length-shown.length;
    return '<div class="col" data-stage="'+st+'"><h3><span>'+st+'</span><span class="mut">'+items.length+'</span></h3>'+shown.map(function(l){
      var chase=l.status==='Quoted'&&l.quotedAt&&Date.now()-l.quotedAt>3*DAY;
      return '<div class="pc" draggable="true" data-id="'+l.id+'"><b>'+esc(l.name)+'</b><br><small>'+esc(l.hood)+' · '+l.score+'</small>'+
       (l.replied?' <span class="badge b-g">Replied</span>':'')+(chase?' <span class="badge b-r">Chase quote</span>':'')+
       '<div class="acts"><button data-act="move" data-id="'+l.id+'" data-d="-1">◀</button><button data-act="move" data-id="'+l.id+'" data-d="1">▶</button><button data-act="replied" data-id="'+l.id+'">'+(l.replied?'Unmark reply':'Replied')+'</button><button data-act="lost" data-id="'+l.id+'">Lost</button></div></div>';}).join('')+
      (hidden>0?'<p class="mut" style="font-size:12px">+'+hidden+' more below 80 or not shown</p>':'')+'</div>';}).join('');
  return '<div class="card"><div class="row sp"><p class="mut" style="margin:0">Drag a card or use the arrows. Booked clients get a reorder nudge and a two-referral ask. Quotes older than 3 days get flagged.</p></div></div><div class="board mt">'+cols+'</div>';
};
function menuTotals(){
  var items=S.menu,tot=0,miss=false,prep=0,lines=[];
  items.forEach(function(m){var q=+ordDraft.qty[m.id]||0;if(q>0){if(m.price===''||m.price==null||isNaN(+m.price))miss=true;else tot+=q*+m.price;prep=Math.max(prep,+m.prep||0);lines.push({m:m,q:q});}});
  var fee=ordDraft.mode==='Delivery'?(+S.fees[ordDraft.ring]||0):0;
  return {tot:tot,miss:miss,prep:prep,lines:lines,fee:fee};
}
function ordSum(){
  var mt=menuTotals(),warn=[];
  mt.lines.forEach(function(x){if(x.q<(+x.m.min||1))warn.push(x.m.name+' needs at least '+x.m.min);});
  if(mt.prep&&ordDraft.date){var earliest=new Date(Date.now()+mt.prep*DAY);earliest.setHours(0,0,0,0);if(new Date(ordDraft.date+'T00:00:00')<earliest)warn.push('Needs '+mt.prep+' prep day'+(mt.prep>1?'s':'')+' before the order date');}
  return '<div class="mt card" style="background:var(--card2)"><div class="row sp"><span>Subtotal</span><b>'+(mt.miss?'$—':money(mt.tot))+'</b></div><div class="row sp"><span>Delivery fee</span><b>'+money(mt.fee)+'</b></div><div class="row sp"><span>Total</span><b class="or" style="font-size:22px">'+(mt.miss?'$—':money(mt.tot+mt.fee))+'</b></div>'+(mt.miss?'<small class="mut">Set prices in the worksheet to see totals.</small>':'')+'</div>'+
   (warn.length?'<div class="banner mt">'+warn.map(esc).join('<br>')+'</div>':'');
}
function qtyLabel(m){return esc(m.name)+(m.price!==''&&m.price!=null?' <span class="mut">'+(m.price===0?'free':money(+m.price))+'</span>':' <span class="mut">price not set</span>');}
function ordPane(){
  var qty=S.menu.map(function(m){return '<div class="row sp" style="padding:6px 0"><span id="ql_'+m.id+'">'+qtyLabel(m)+'</span><input type="number" min="0" data-bind="ordQty" data-id="'+m.id+'" value="'+(ordDraft.qty[m.id]||'')+'" style="width:80px" placeholder="0"></div>';}).join('');
  return '<h2>Order builder</h2><div class="grid g2 mt"><div class="f"><label>Customer</label><input data-bind="ordField" data-f="name" value="'+esc(ordDraft.name)+'"></div><div class="f"><label>Phone</label><input data-bind="ordField" data-f="phone" value="'+esc(ordDraft.phone)+'"></div>'+
   '<div class="f"><label>Date needed</label><input type="date" data-bind="ordField" data-f="date" value="'+esc(ordDraft.date)+'"></div><div class="f"><label>Pickup or delivery</label><select data-bind="ordField" data-f="mode"><option'+(ordDraft.mode==='Pickup'?' selected':'')+'>Pickup</option><option'+(ordDraft.mode==='Delivery'?' selected':'')+'>Delivery</option></select></div></div>'+
   (ordDraft.mode==='Delivery'?'<div class="f"><label>Delivery ring</label><select data-bind="ordField" data-f="ring">'+[1,2,3].map(function(r){return '<option value="'+r+'"'+(+ordDraft.ring===r?' selected':'')+'>'+ringTxt(r)+'</option>';}).join('')+'</select></div>':'')+

VIEWS.pkg=function(){
  function card(t,big,txt){return '<div class="card"><h3>'+t+'</h3><div class="kpi mt"><div class="n">'+big+'</div></div><p class="mut">'+txt+'</p></div>';}
  return heroStrip('Simple and fair','One build fee. Pay it your way.')+'<div class="grid g3">'+card('Build','$3,500','One time. Site upgrade, online ordering, this portal and the outreach plan, built and ready to run.')+card('Pay your way','Plans','Payment plan directly, or Affirm and other buy now pay later options.')+card('Want help running it?','$150/hr','Optional. Hands-on help launching and running the outreach, only when wanted.')+'</div>'+
  '<div class="card mt"><h2>More leads, by the batch</h2><table style="width:100%;border-collapse:collapse;font-size:15px"><tr style="text-align:left"><th>Batch</th><th>Price</th><th>Per lead</th></tr><tr><td>25 leads</td><td>$150</td><td>$6.00</td></tr><tr><td>50 leads</td><td>$275</td><td>$5.50</td></tr><tr><td>100 leads</td><td>$500</td><td>$5.00</td></tr></table><p class="mut">Each lead is scored, with the contact, the reason to reach out and a message in the chef\'s voice.</p></div>'+'<div class="grid g2 mt"><div class="card"><h2>What is included</h2><ul><li>Upgraded borientalsushi.com with real food photos and a clear order path</li><li>Meal prep order page for the site, with orders sent to the chef\'s phone</li><li>This portal: leads, outreach in the chef\'s voice, pipeline, order desk, service area map</li><li>About 250 Charlotte targets in six segments, with the first 41 verified</li><li>Two outreach tracks: email for offices, social DMs for events and hospitality</li><li>Short Instagram clips and a weekly post plan</li></ul></div>'+
  '<div class="card"><h2>What we need to start</h2><ul><li>Food photos already on the chef\'s phone. No new shoot needed.</li><li>Dish descriptions and prices, confirmed by the chef</li><li>Confirm the lead: pickup and delivery first, catering after</li><li>A start date. We begin the Monday after.</li></ul></div></div>';
};
VIEWS.site=function(){
  var im=PH;
  var shots=Object.keys(im).map(function(k){return '<div class="card" style="padding:8px"><img src="'+im[k]+'" alt="'+k+'" style="width:100%;height:150px;object-fit:cover;border-radius:4px"><div class="mut" style="text-align:center;margin-top:6px;text-transform:capitalize">'+k+'</div></div>';}).join('');
  return '<div class="card"><h2>Photos pulled from borientalsushi.com</h2><p class="mut">These are about 300px, fine for the mockups, too small for the live site. Real photos from the chef\'s phone replace them.</p><div class="grid g4 mt">'+shots+'</div></div>'+
  '<div class="grid g2 mt"><div class="card"><h2>Upgrade scope</h2><ul><li>Hero with the best bowl photo and one clear button: order or book</li><li>Menu with real prices and dish descriptions</li><li>Mobile first layout, since most visitors arrive from Instagram</li><li>Catering and event inquiry form that lands in this portal</li><li>Charlotte local angle and service area</li></ul></div>'+
  '<div class="card"><h2>Checklist</h2>'+[['photos','Food photos received from the chef'],['menu','Dish descriptions and prices confirmed'],['lead','Lead confirmed: pickup and delivery, then catering'],['mascot','Mascot approved (The Chef)'],['live','Upgraded site reviewed and live']].map(function(c){var k='site_'+c[0];return '<label class="chk'+(S.plan[k]?' done':'')+'" style="margin:0;color:inherit;font-size:15px"><input type="checkbox" data-bind="plan" data-k="'+k+'"'+(S.plan[k]?' checked':'')+'> '+c[1]+'</label>';}).join('')+'</div></div>';
};
VIEWS.clips=function(){
  var C=[['Clip 1: Singles and Social','Singles night. Game night. Supper club. Puerto Rican flavor, rolled by hand, right here in Charlotte. Planning something social? Message Chef Izaya for a free sample tray. Taste it first.'],
  ['Clip 2: Business Events','Team lunch getting boring? I\'m Chef Izaya with Boriental Sushi. Empanadas, karaage, and island fusion rolls, made by hand in Charlotte. Got a mixer or an office event coming up? Message me for a free sample tray.'],
  ['Clip 3: Latin Nights','Latin night needs food that matches the music. I\'m Chef Izaya with Boriental Sushi. Island meets sushi, with Puerto Rican soul in every roll. Hosting a Latin night in Charlotte? Message me and I\'ll send a free sample tray.']];
  return '<div class="grid g3">'+C.map(function(c,i){return '<div class="card"><h3>'+c[0]+'</h3><p style="margin:12px 0">'+esc(c[1])+'</p><p class="mut">End card: @izayathahighfather, 704-905-2262</p><button class="btn sm sec" data-act="clipCopy" data-i="'+i+'">Copy script</button></div>';}).join('')+'</div><p class="mut mt">Clip 1 is rendered as kinetic type with no avatar. Clips 2 and 3 follow in the same style once the chef\'s food photos arrive.</p>';
};
window.CLIPS=null;
VIEWS.plan=function(){
  var wk=Math.min(6,Math.ceil(planDay()/7));
  return '<div class="grid g2">'+PLAN.map(function(w,wi){var done=w[1].filter(function(_,i){return S.plan['w'+wi+'_'+i];}).length;
   return '<div class="card" style="'+(wi+1===wk?'border-color:var(--or)':'')+'"><div class="row sp"><h2>'+w[0]+(wi+1===wk?' <span class="badge b-o">This week</span>':'')+'</h2><span class="mut">'+done+' of '+w[1].length+'</span></div><div class="bar mt"><i style="width:'+(done/w[1].length*100)+'%"></i></div>'+
    w[1].map(function(t,i){var k='w'+wi+'_'+i,c=S.plan[k];return '<label class="chk'+(c?' done':'')+'" style="margin:0;color:inherit;font-size:15px"><input type="checkbox" data-bind="plan" data-k="'+k+'" '+(c?'checked':'')+'><span>'+esc(t)+'</span></label>';}).join('')+'</div>';}).join('')+'</div>';
};
VIEWS.set=function(){
  var s=S.settings;
  return '<div class="grid g2"><div class="card"><h2>Business</h2><div class="grid g2 mt"><div class="f"><label>Business name</label><input data-bind="setting" data-k="business" value="'+esc(s.business)+'"></div><div class="f"><label>Chef name (used in messages)</label><input data-bind="setting" data-k="chef" value="'+esc(s.chef)+'"></div>'+

/* ---------- csv ---------- */
function parseCSV(t){
  var rows=[],row=[],f='',q=false,i=0,c;
  t=t.replace(/^﻿/,'');
  for(;i<t.length;i++){c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[];}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function csvCell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function segKey(v){v=String(v||'').toLowerCase().trim();var ks=Object.keys(SEG);for(var i=0;i<ks.length;i++){if(ks[i]===v||SEG[ks[i]].label.toLowerCase()===v||v.indexOf(ks[i].slice(0,5))===0)return ks[i];}
  if(/apart|resident|multi/.test(v))return 'apartments';if(/single/.test(v))return 'singles';if(/cultur|latin|festival|heritage|social|communit/.test(v))return 'social';if(/biz|business|network|mixer|chamber/.test(v))return 'bizevents';if(/venue/.test(v))return 'venues';if(/brew|tap|bar/.test(v))return 'breweries';if(/plan/.test(v))return 'planners';if(/office|hr|corp/.test(v))return 'offices';if(/gym|run|club|fit/.test(v))return 'gyms';return 'offices';}
function leadsFromCSV(text){
  var rows=parseCSV(text),out=[];if(rows.length<2)return out;
  var hd=rows[0].map(function(h){return h.toLowerCase().trim();}),ix=function(n){return hd.indexOf(n);},add=0;
  if(ix('name')<0)return null;
  rows.slice(1).forEach(function(r){var g=function(n){var i=ix(n);return i<0?'':(r[i]||'').trim();};if(!g('name'))return;
    var hood=g('hood');if(!HOODS[hood]){var hk=Object.keys(HOODS).filter(function(h){return h.toLowerCase()===hood.toLowerCase();})[0];hood=hk||'Uptown';}
    var seg=segKey(g('segment')),la=parseFloat(g('lat')),lo=parseFloat(g('lon'));
    var l=mkLead({name:g('name'),segment:seg,hood:hood,contact:g('contact'),email:g('email'),handle:g('handle'),notes:g('notes')+(g('confidence')?(g('notes')?' | ':'')+'Status: '+g('confidence'):''),source:g('source'),lat:isNaN(la)?null:la,lon:isNaN(lo)?null:lo,channel:g('email')?'email':SEG[seg].channel,reason:g('reason'),eventType:g('eventtype'),event:g('event'),eventDate:g('eventdate')});
    out.push(l);add++;});
  return out;
}
function importCSV(text){
  var ls=leadsFromCSV(text);if(ls===null){toast('CSV needs a name column');return;}if(!ls.length){toast('No rows found');return;}
  S.leads=S.leads.concat(ls);save();toast('Imported '+ls.length+' leads');rerender();
}

function realLeads(){var ls=leadsFromCSV(REAL_CSV);return ls&&ls.length?ls:makeSample();}

/* ---------- actions ---------- */
var A={
 nav:function(t){cur=t.dataset.view;render();},
 outTab:function(t){outTab=t.dataset.t;render();},
 addLead:function(){openLead(null);},
 addEvent:function(){openLead('ev');},
 editLead:function(t){openLead(t.dataset.id);},
 closeModal:closeModal,
 saveLead:function(t){
  var id=t.dataset.id==='ev'?'':t.dataset.id,g=function(k){return $('#lf_'+k).value.trim();};
  if(!g('name')){toast('Business name needed');return;}
  var l=id?leadById(id):null;
  if(l){var hoodChanged=l.hood!==g('hood');l.name=g('name');l.segment=g('segment');l.hood=g('hood');l.channel=g('channel');l.contact=g('contact');l.email=g('email');l.handle=g('handle');l.reason=$('#lf_reason').value;l.notes=$('#lf_notes').value;l.event=g('event');l.eventType=g('eventType');l.eventDate=$('#lf_eventDate').value;
    if(hoodChanged){var h=HOODS[l.hood];l.lat=h.lat+(Math.random()-.5)*.024;l.lon=h.lon+(Math.random()-.5)*.024;}
    if(l.status!==g('status'))setStatus(l,g('status'));recompute(l);
  }else{var n=mkLead({name:g('name'),segment:g('segment'),hood:g('hood'),channel:g('channel'),contact:g('contact'),email:g('email'),handle:g('handle'),reason:$('#lf_reason').value,notes:$('#lf_notes').value,event:g('event'),eventType:g('eventType'),eventDate:$('#lf_eventDate').value});if(g('status')!=='New')setStatus(n,g('status'));S.leads.push(n);}
  save();closeModal();toast('Saved');rerender(true);
 },
 delLead:function(t){if(confirm('Delete this lead?')){S.leads=S.leads.filter(function(l){return l.id!==t.dataset.id;});save();rerender(true);}},
 importCsv:function(){$('#csvfile').click();},
 exportCsv:function(){var cols=['name','segment','hood','contact','email','handle','channel','status','score','lat','lon','eventType','event','eventDate','source','notes'];download('boriental-leads.csv',[cols.join(',')].concat(S.leads.map(function(l){return cols.map(function(c){return csvCell(l[c]);}).join(',');})).join('\n'),'text/csv');},
 copyMsg:function(t){var l=leadById(t.dataset.id),nt=nextTouch(l);if(!nt)return;var tp=S.templates[l.channel][nt.n-1];copyText((l.channel==='email'?'Subject: '+fill(tp.subject,l)+'\n\n':'')+fill(tp.body,l));},
 sent:function(t){var l=leadById(t.dataset.id),nt=nextTouch(l);if(!nt)return;if(!S.approved[l.channel]&&!confirm('This sequence is not marked approved yet. Mark as sent anyway?'))return;
  l.touches.push({n:nt.n,ts:Date.now(),ch:l.channel});if(l.status==='New')setStatus(l,'Contacted');save();toast('Touch '+nt.n+' logged');rerender(true);},
 move:function(t){var l=leadById(t.dataset.id),i=STAGES.indexOf(l.status)+ +t.dataset.d;if(i<0||i>=STAGES.length)return;setStatus(l,STAGES[i]);save();rerender(true);},
 replied:function(t){var l=leadById(t.dataset.id);l.replied=!l.replied;l.repliedAt=l.replied?Date.now():0;save();rerender(true);},
 lost:function(t){var l=leadById(t.dataset.id);setStatus(l,'Lost');save();rerender(true);},
 menuAdd:function(){S.menu.push({id:uid(),cat:'Meal prep box',name:'New item',desc:'',price:'',prep:2,min:1});save();rerender(true);},
 menuDel:function(t){S.menu=S.menu.filter(function(m){return m.id!==t.dataset.id;});save();rerender(true);},
 orderSave:function(){
  var mt=menuTotals();if(!mt.lines.length){toast('Add at least one item');return;}if(!ordDraft.name.trim()){toast('Customer name needed');return;}
  S.orders.push({id:uid(),name:ordDraft.name,phone:ordDraft.phone,date:ordDraft.date,mode:ordDraft.mode,ring:+ordDraft.ring,items:mt.lines.map(function(x){return x.q+' × '+x.m.name;}).join(', '),total:mt.miss?'Price not set':money(mt.tot+mt.fee),status:'New'});
  ordDraft={name:'',phone:'',date:'',mode:'Pickup',ring:1,qty:{}};save();toast('Order saved');rerender(true);},
 orderDel:function(t){S.orders=S.orders.filter(function(o){return o.id!==t.dataset.id;});save();rerender(true);},
 clipCopy:function(t){var el=t.closest('.card').querySelector('p');copyText(el.textContent);},
 socialCopy:function(t){var p=S.social[+t.dataset.i];copyText(p.caption||p.theme);},
 socialReset:function(){S.social.forEach(function(p){p.done=false;});save();rerender(true);},
 backup:function(){download('boriental-portal-backup.json',JSON.stringify(S),'application/json');},
 restore:function(){$('#jsonfile').click();},
 demoFill:function(){
  var top=S.leads.filter(function(l){return l.score>=80;}).sort(function(a,b){return b.score-a.score;}).slice(0,20),now=Date.now();
  top.forEach(function(l,i){l.touches=[{n:1,ts:now-(5-i%5)*DAY*.9,ch:l.channel}];l.stageAt={Contacted:l.touches[0].ts};l.status='Contacted';
    if(i<12){l.replied=true;l.repliedAt=now-DAY*(1+i%4);}
    if(i<7){l.status='Tasting';l.stageAt.Tasting=now-DAY*(1+i%3);}
    if(i<4){l.status='Quoted';l.quotedAt=now-DAY*(i===0?4:1);l.stageAt.Quoted=l.quotedAt;}
    if(i<2){l.status='Booked';l.stageAt.Booked=now-DAY*i;}});
  save();toast('Demo activity added');rerender();},
 clearActivity:function(){S.leads.forEach(function(l){l.status='New';l.replied=false;l.repliedAt=0;l.quotedAt=0;l.touches=[];l.stageAt={};});save();toast('Activity cleared');rerender();},
 removeSample:function(){if(confirm('Remove all sample leads?')){S.leads=S.leads.filter(function(l){return !l.sample;});save();rerender();}},
 resetAll:function(){if(confirm('Reset everything in this browser?')){S=defaultState();save();rerender();}}
};
function refreshPane(){var p=$('#ordpane');if(p)p.innerHTML=ordPane();}
function refreshLabels(){S.menu.forEach(function(m){var e=$('#ql_'+m.id);if(e)e.innerHTML=qtyLabel(m);});}
function refreshSum(){var p=$('#ordsum');if(p)p.innerHTML=ordSum();}
var B={
 stratType:function(t){stratType=t.value;rerender(true);},
 tpl:function(t){S.templates[t.dataset.ch][+t.dataset.i][t.dataset.f]=t.value;save();},
 approve:function(t){S.approved[t.dataset.ch]=t.checked;save();rerender(true);},
 setting:function(t){var k=t.dataset.k;S.settings[k]=k==='weekly'?(+t.value||40):t.value;save();if(k==='business')renderNav();},
 menu:function(t){var m=S.menu.filter(function(x){return x.id===t.dataset.id;})[0],f=t.dataset.f;m[f]=(f==='price')?(t.value===''?'':+t.value):(f==='prep'||f==='min')?(+t.value||0):t.value;save();refreshLabels();refreshSum();},
 fee:function(t){S.fees[t.dataset.r]=t.value===''?'':+t.value;save();refreshSum();},
 ordField:function(t){var f=t.dataset.f;ordDraft[f]=t.value;if(f==='mode'||f==='ring')refreshPane();else if(f==='date')refreshSum();},
 ordQty:function(t){ordDraft.qty[t.dataset.id]=+t.value||0;refreshSum();},
 orderStatus:function(t){S.orders.filter(function(o){return o.id===t.dataset.id;})[0].status=t.value;save();},
 social:function(t){var p=S.social[+t.dataset.i],f=t.dataset.f;p[f]=f==='done'?t.checked:t.value;save();},
 plan:function(t){S.plan[t.dataset.k]=t.checked;save();rerender(true);}
};
document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(t&&A[t.dataset.act]){e.preventDefault();A[t.dataset.act](t,e);}else if(e.target.id==='ov')closeModal();});
document.addEventListener('change',function(e){var t=e.target.closest('[data-bind]');if(t&&B[t.dataset.bind]){B[t.dataset.bind](t,e);return;}if(e.target.id==='fseg'||e.target.id==='fring'||e.target.id==='fready')applyFilter();});
document.addEventListener('input',function(e){if(e.target.id==='q')applyFilter();});
$('#csvfile').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){importCSV(String(r.result));};r.readAsText(f);e.target.value='';});
$('#jsonfile').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(String(r.result));if(o&&o.v===1&&o.leads){S=o;save();toast('Backup restored');rerender();}else toast('Not a valid backup');}catch(x){toast('Not a valid backup');}};r.readAsText(f);e.target.value='';});
/* drag and drop */
document.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('.pc');if(c){e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',function(e){var c=e.target.closest&&e.target.closest('.col');if(c){e.preventDefault();c.classList.add('over');}});
document.addEventListener('dragleave',function(e){var c=e.target.closest&&e.target.closest('.col');if(c)c.classList.remove('over');});
document.addEventListener('drop',function(e){var c=e.target.closest&&e.target.closest('.col');if(!c)return;e.preventDefault();var l=leadById(e.dataTransfer.getData('text/plain'));if(l&&l.status!==c.dataset.stage){setStatus(l,c.dataset.stage);save();rerender(true);}});

S=load();
if(location.hash){var h=location.hash.slice(1);if(VIEWS[h])cur=h;}
render();
})();
</script>
